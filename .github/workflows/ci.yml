name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .

      - name: Run unit tests
        run: |
          cd build
          ../unittests/unittests.sh -f
